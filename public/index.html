<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen Share</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100dvh; background: #111; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; text-align: center; }
  h2 { margin: 0; font-weight: 600; }
  button { background: #5865f2; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  button:hover { filter: brightness(1.12); }
  button.stop { background: #d83c3e; }
  input, select { background: #222; color: #eee; border: 1px solid #444; border-radius: 8px; padding: 9px; font-size: 14px; }
  input { width: min(460px, 90vw); }
  video { width: min(1280px, 96vw); max-height: 80dvh; background: #000; border-radius: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .hint { color: #888; font-size: 13px; margin: 0; }
  #status { color: #aaa; font-size: 14px; min-height: 1.2em; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h2 id="title">Screen Share</h2>

  <!-- Landing: create a room -->
  <div id="landing" class="hidden"><button id="create">Create room</button></div>

  <!-- Host controls -->
  <div id="host" class="hidden">
    <div class="row"><input id="link"><button id="copy">Copy link</button></div>
    <div class="row">
      <label class="hint" for="max">Max viewers</label>
      <select id="max"><option>1</option><option>2</option><option>3</option><option>4</option><option value="custom">Custom…</option></select>
      <input id="maxcustom" class="hidden" type="number" min="1" max="50" value="5" style="width:70px">
      <button id="share">Start sharing</button>
      <button id="stop" class="stop hidden">Stop</button>
    </div>
    <p class="hint" style="margin-top:10px">Pick <b>Entire screen</b> and tick <b>Share system audio</b>.</p>
  </div>

  <!-- Viewer controls -->
  <div id="viewer" class="hidden">
    <button id="join">Join &amp; watch</button>
    <p class="hint" style="margin-top:10px">Click to join, it also enables sound.</p>
  </div>

  <video id="vid" class="hidden" autoplay playsinline controls></video>
  <div id="status"></div>

<script>
// ============ Config ============
const ICE_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
const VIDEO_MAX_BITRATE = 8_000_000; // bits/second, per viewer

// ============ Helpers ============
const $ = (id) => document.getElementById(id);
const setStatus = (text) => ($('status').textContent = text);
const show = (id) => $(id).classList.remove('hidden');
const hide = (id) => $(id).classList.add('hidden');
const sendJson = (ws, obj) => ws.readyState === WebSocket.OPEN && ws.send(JSON.stringify(obj));

// Edits the connection description so Opus audio is stereo at high bitrate (default is low-bitrate mono).
const hifi = (sdp) => sdp.replace(/(a=fmtp:\d+ [^\r\n]*useinbandfec=1)/g, '$1;stereo=1;sprop-stereo=1;maxaveragebitrate=510000');

function openSocket(room, role, token) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  return new WebSocket(`${proto}://${location.host}/?room=${room}&role=${role}${token ? `&token=${token}` : ''}`);
}

// Sending side: hold ICE candidates back until our offer/answer is sent, so the
// other side never receives a candidate before the description it belongs to.
function makeIceOutbox(sendCandidate) {
  let released = false;
  const held = [];
  return {
    push(c) { released ? sendCandidate(c) : held.push(c); },
    release() { released = true; held.splice(0).forEach(sendCandidate); },
  };
}

// Receiving side: queue candidates that arrive before the remote description is set.
function makeIceQueue() {
  const queue = [];
  const apply = (pc, c) => pc.addIceCandidate(c).catch(() => {});
  return {
    add(pc, c) { pc && pc.remoteDescription ? apply(pc, c) : queue.push(c); },
    flush(pc) { queue.splice(0).forEach((c) => apply(pc, c)); },
  };
}

// ============ Pick a mode from the URL ============
//   /                       -> landing page
//   /r/<room>#host=<token>  -> host (the token is a secret that only the creator has)
//   /r/<room>               -> viewer
const roomMatch = location.pathname.match(/^\/r\/([0-9a-f-]{36})$/);
const hostMatch = location.hash.match(/^#host=([0-9a-f-]{36})$/);
if (!roomMatch) startLanding();
else if (hostMatch) startHost(roomMatch[1], hostMatch[1]);
else startViewer(roomMatch[1]);

// ============ Landing ============
function startLanding() {
  show('landing');
  $('create').onclick = () => { location.href = `/r/${crypto.randomUUID()}#host=${crypto.randomUUID()}`; };
}

// ============ Host ============
function startHost(room, token) {
  $('title').textContent = 'Hosting';
  show('host');
  setupShareLink(room);

  const ws = openSocket(room, 'host', token);
  const send = (obj) => sendJson(ws, obj);
  const viewers = new Set(); // ids of viewers currently in the room
  const peers = new Map();   // viewerId -> { pc, ice }: one WebRTC connection per viewer
  let stream = null;         // the captured screen while sharing
  let warning = '';          // a problem message that replaces the normal status

  function refreshStatus() {
    if (warning) return setStatus(warning);
    if (stream) return setStatus(`Sharing to ${viewers.size} viewer(s)`);
    setStatus(viewers.size
      ? `${viewers.size} viewer(s) in the room. Click Start sharing.`
      : 'Waiting for your friend to open the link…');
  }

  // Tell the server how many viewers may join.
  function sendMax() {
    const custom = $('max').value === 'custom';
    $('maxcustom').classList.toggle('hidden', !custom);
    send({ type: 'max', n: +(custom ? $('maxcustom').value : $('max').value) });
  }

  // Create a connection to one viewer and send them an offer.
  async function callViewer(id) {
    peers.get(id)?.pc.close();
    const pc = new RTCPeerConnection(ICE_CONFIG);
    const ice = makeIceQueue();
    const outbox = makeIceOutbox((candidate) => send({ type: 'ice', to: id, candidate }));
    peers.set(id, { pc, ice });

    pc.onicecandidate = (e) => e.candidate && outbox.push(e.candidate);
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === 'failed') { warning = 'A viewer could not connect (their network may block direct connections).'; refreshStatus(); }
      else if (pc.connectionState === 'connected') { warning = ''; refreshStatus(); }
    };

    for (const track of stream.getTracks()) {
      if (track.kind === 'video') {
        pc.addTransceiver(track, { direction: 'sendonly', streams: [stream], sendEncodings: [{ maxBitrate: VIDEO_MAX_BITRATE }] });
      } else {
        pc.addTrack(track, stream);
      }
    }

    const offer = await pc.createOffer();
    offer.sdp = hifi(offer.sdp);
    await pc.setLocalDescription(offer);
    send({ type: 'offer', to: id, sdp: pc.localDescription });
    outbox.release();
  }

  async function startSharing() {
    if (stream) return;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 60 },
        // Turn off voice-call processing so game/music audio isn't mangled.
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 2 },
      });
    } catch { stream = null; return; } // picker cancelled
    const video = stream.getVideoTracks()[0];
    video.contentHint = 'motion'; // prefer keeping resolution and smoothness
    video.onended = stopSharing;  // the browser's own "Stop sharing" bar
    warning = stream.getAudioTracks().length ? '' : 'Sharing WITHOUT audio. Stop and re-share with "Share system audio" ticked.';
    hide('share'); show('stop');
    refreshStatus();
    viewers.forEach((id) => callViewer(id).catch(console.error));
  }

  function stopSharing() {
    if (!stream) return;
    send({ type: 'stopped' });
    stream.getTracks().forEach((t) => t.stop());
    stream = null; warning = '';
    peers.forEach(({ pc }) => pc.close());
    peers.clear();
    hide('stop'); show('share');
    refreshStatus();
  }

  async function onMessage(msg) {
    const peer = peers.get(msg.from);
    switch (msg.type) {
      case 'viewer-joined':
        viewers.add(msg.id);
        refreshStatus();
        if (stream) await callViewer(msg.id); // already sharing: call them right away
        break;
      case 'viewer-left':
        viewers.delete(msg.id);
        peers.get(msg.id)?.pc.close();
        peers.delete(msg.id);
        refreshStatus();
        break;
      case 'answer':
        if (!peer) break;
        await peer.pc.setRemoteDescription(msg.sdp);
        peer.ice.flush(peer.pc);
        break;
      case 'ice':
        if (peer) peer.ice.add(peer.pc, msg.candidate);
        break;
      case 'error':
        warning = msg.msg;
        refreshStatus();
        break;
    }
  }

  ws.onopen = sendMax;
  ws.onmessage = (e) => onMessage(JSON.parse(e.data)).catch(console.error);
  ws.onclose = () => { warning = warning || 'Lost connection to the server. Refresh to retry.'; refreshStatus(); };
  $('max').onchange = sendMax;
  $('maxcustom').oninput = sendMax;
  $('share').onclick = startSharing;
  $('stop').onclick = stopSharing;
  refreshStatus();
}

// The link to give your friend. On localhost it uses your LAN IP so other devices can open it.
function setupShareLink(room) {
  $('link').value = `${location.origin}/r/${room}`;
  if (['localhost', '127.0.0.1'].includes(location.hostname)) {
    fetch('/lan').then((r) => r.json()).then((ips) => {
      const ip = ips.find((i) => i.startsWith('192.168.')) || ips[0];
      if (ip) $('link').value = `http://${ip}:${location.port || 80}/r/${room}`;
    }).catch(() => {});
  }
  $('copy').onclick = () => {
    $('link').select();
    navigator.clipboard?.writeText($('link').value);
    $('copy').textContent = 'Copied!';
    setTimeout(() => ($('copy').textContent = 'Copy link'), 1500);
  };
}

// ============ Viewer ============
function startViewer(room) {
  $('title').textContent = 'Watching';
  show('viewer');

  $('join').onclick = () => {
    hide('viewer');
    setStatus('Connecting…');
    const ws = openSocket(room, 'viewer');
    const send = (obj) => sendJson(ws, obj);
    let pc = null;
    let ice = makeIceQueue();
    let finished = false; // true once we know why we're leaving (e.g. room full)

    function stopWatching() {
      pc?.close();
      pc = null;
      $('vid').srcObject = null;
      hide('vid');
    }

    // The host sent an offer: build the connection and answer it.
    async function onOffer(msg) {
      pc?.close();
      pc = new RTCPeerConnection(ICE_CONFIG);
      ice = makeIceQueue();
      const outbox = makeIceOutbox((candidate) => send({ type: 'ice', candidate }));
      const thisPc = pc;

      pc.onicecandidate = (e) => e.candidate && outbox.push(e.candidate);
      pc.onconnectionstatechange = () => {
        if (thisPc.connectionState === 'failed') setStatus('Could not connect. Your network may block direct connections.');
      };
      pc.ontrack = (e) => {
        const video = $('vid');
        if (video.srcObject !== e.streams[0]) video.srcObject = e.streams[0];
        show('vid');
        video.play().catch(() => {});
        setStatus('');
      };

      await pc.setRemoteDescription(msg.sdp);
      ice.flush(pc);
      const answer = await pc.createAnswer();
      answer.sdp = hifi(answer.sdp);
      await pc.setLocalDescription(answer);
      send({ type: 'answer', sdp: pc.localDescription });
      outbox.release();
    }

    async function onMessage(msg) {
      switch (msg.type) {
        case 'waiting': setStatus("Connected. The host hasn't opened the room yet, waiting…"); break;
        case 'full': finished = true; setStatus('This room is full.'); break;
        case 'offer': await onOffer(msg); break;
        case 'ice': ice.add(pc, msg.candidate); break;
        case 'stopped': stopWatching(); setStatus('The host stopped sharing. Waiting for them to start again…'); break;
        case 'host-left': stopWatching(); setStatus('The host closed the room.'); break;
      }
    }

    ws.onopen = () => setStatus('Connected. Waiting for the host to start sharing…');
    ws.onmessage = (e) => onMessage(JSON.parse(e.data)).catch(console.error);
    ws.onclose = () => { if (!finished) setStatus('Disconnected. Refresh to rejoin.'); };
  };
}
</script>
</body>
</html>
