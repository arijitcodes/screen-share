<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Player</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #000; color: #ddd; }
  #bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 8px 12px; background: #18181d; font-size: 13px; }
  #bar.hidden { display: none; }
  button { background: #2a2a33; color: #fff; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  video { flex: 1; min-height: 0; width: 100%; background: #000; }
  select { max-width: 280px; background: #2a2a33; color: #fff; border: 0; border-radius: 6px; padding: 4px 6px; }
  #scan, #ahint { color: #9a9aa5; }
  .hidden { display: none !important; }
</style>
<style id="cuestyle"></style>
</head>
<body>
  <div id="bar">
    <label>Video <input type="file" id="v" accept="video/*,.mkv,.mp4,.webm,.avi"></label>
    <label>Subtitles <input type="file" id="s" accept=".srt,.vtt"></label>
    <label>Embedded <select id="es"><option value="-1">None / external file</option></select></label>
    <span id="scan"></span>
    <label id="aw" class="hidden">Audio <select id="as"></select></label>
    <span id="ahint"></span>
    <span>Sync <button id="m">-0.5s</button> <b id="o">0.0s</b> <button id="p">+0.5s</button> <button id="r">Reset</button></span>
    <span>Size <button id="sm">A-</button> <button id="sp">A+</button></span>
    <button id="h">Hide bar (H)</button>
  </div>
  <video id="vid" controls></video>

<script>
// ---pure--- (subtitle conversion)
const pad = (n, l = 2) => String(n).padStart(l, '0');
function fmt(t) {
  const total = Math.max(0, Math.round(t * 1000));
  const ms = total % 1000, s = Math.floor(total / 1000) % 60, m = Math.floor(total / 60000) % 60, h = Math.floor(total / 3600000);
  return `${pad(h)}:${pad(m)}:${pad(s)}.${pad(ms, 3)}`;
}
const toSec = (h, m, s, frac) => +h * 3600 + +m * 60 + +s + +('0.' + frac);
function parseSrt(text) {
  const cues = [];
  text = text.replace(/^\uFEFF/, '').replace(/\r/g, '');
  for (const block of text.split(/\n{2,}/)) {
    const lines = block.split('\n');
    const i = lines.findIndex((l) => l.includes('-->'));
    if (i < 0) continue;
    const m = lines[i].match(/(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/);
    if (!m) continue;
    const body = lines.slice(i + 1).join('\n').replace(/<\/?font[^>]*>/g, '').replace(/\{\\[^}]*\}/g, '').trim();
    if (body) cues.push({ start: toSec(m[1], m[2], m[3], m[4]), end: toSec(m[5], m[6], m[7], m[8]), text: body });
  }
  return cues;
}
function buildVtt(cues, offset) {
  const out = cues.filter((c) => c.end + offset > 0)
    .map((c, i) => `${i + 1}\n${fmt(c.start + offset)} --> ${fmt(c.end + offset)}\n${c.text}\n`);
  return 'WEBVTT\n\n' + out.join('\n');
}

// --- Matroska (MKV/WebM) reader: finds the embedded text subtitle tracks and their cues ---
const MKV = { EBML: 0x1A45DFA3, SEGMENT: 0x18538067, INFO: 0x1549A966, TIMESCALE: 0x2AD7B1, TRACKS: 0x1654AE6B, ENTRY: 0xAE,
  NUMBER: 0xD7, TYPE: 0x83, CODEC: 0x86, NAME: 0x536E, LANG: 0x22B59C, FORCED: 0x55AA, DEFAULT: 0x88,
  ENCODINGS: 0x6D80, ENCODING: 0x6240, COMPRESSION: 0x5034, COMP_ALGO: 0x4254, COMP_SETTINGS: 0x4255,
  CLUSTER: 0x1F43B675, CTIME: 0xE7, SIMPLE: 0xA3, GROUP: 0xA0, BLOCK: 0xA1, DURATION: 0x9B };
// Containers we step into; every other element is skipped using its size.
const MKV_ENTER = new Set([MKV.SEGMENT, MKV.INFO, MKV.TRACKS, MKV.ENTRY, MKV.ENCODINGS, MKV.ENCODING, MKV.COMPRESSION, MKV.CLUSTER, MKV.GROUP]);
// Small values we read.
const MKV_LEAF = new Set([MKV.TIMESCALE, MKV.NUMBER, MKV.TYPE, MKV.CODEC, MKV.NAME, MKV.LANG, MKV.FORCED, MKV.DEFAULT, MKV.COMP_ALGO, MKV.COMP_SETTINGS, MKV.CTIME]);
const TEXT_CODECS = new Set(['S_TEXT/UTF8', 'S_TEXT/ASCII', 'S_TEXT/ASS', 'S_TEXT/SSA']);

// Matroska time: ticks * TimestampScale (nanoseconds per tick) = ns; the rest of the player works in seconds.
const mkvTicksToSec = (ticks, scale) => ticks * scale / 1e9;
const mkvUint = (b) => { let v = 0; for (let i = 0; i < b.length; i++) v = v * 256 + b[i]; return v; };
function mkvId(b, i) { // element id (marker bits kept): [id, byteLength] or null
  const first = b[i];
  if (!first) return null;
  const len = Math.clz32(first) - 23;
  if (len > 4 || i + len > b.length) return null;
  return [mkvUint(b.subarray(i, i + len)), len];
}
function mkvSize(b, i) { // data size or track number: [value, byteLength], value -1 = unknown size
  const first = b[i];
  if (!first) return null;
  const len = Math.clz32(first) - 23;
  if (len > 8 || i + len > b.length) return null;
  const mask = 0xFF >> len;
  let v = first & mask, allOnes = v === mask;
  for (let k = 1; k < len; k++) { v = v * 256 + b[i + k]; if (b[i + k] !== 0xFF) allOnes = false; }
  return [allOnes ? -1 : v, len];
}
async function inflate(bytes) { // zlib, used by some older MKVs for subtitle tracks
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
function assText(raw) { // "ReadOrder,Layer,Style,Name,MarginL,MarginR,MarginV,Effect,Text" -> plain text
  const f = raw.split(',');
  const t = f.length > 8 ? f.slice(8).join(',') : raw;
  return t.replace(/\{[^}]*\}/g, '').replace(/\\N/gi, '\n').replace(/\\h/g, ' ').trim();
}

// Reads the whole file once in big chunks. Returns null if it isn't Matroska/WebM, otherwise
// { subtitles: [{ number, name, lang, codec, forced, def, supported, cues: [{start, end, text}] }], audio: [...] }.
async function scanMkv(file, onProgress) {
  const win = { start: 0, buf: new Uint8Array(0) };
  const at = async (off, len) => { // bytes [off, off+len), reading ahead in 8 MB windows
    const end = Math.min(off + len, file.size);
    if (off < win.start || end > win.start + win.buf.length) {
      win.start = off;
      win.buf = new Uint8Array(await file.slice(off, Math.min(off + Math.max(len, 8 << 20), file.size)).arrayBuffer());
    }
    return win.buf.subarray(off - win.start, end - win.start);
  };
  const first = await at(0, 4);
  if (first.length < 4 || mkvUint(first) !== MKV.EBML) return null;

  const decoder = new TextDecoder();
  const tracks = [];
  let cur = null, trackMap = null, scale = 1000000, clusterTime = 0, lastCue = null, off = 0, lastReport = 0;

  while (off < file.size) {
    const h = await at(off, 16);
    const id = mkvId(h, 0);
    const sz = id && mkvSize(h, id[1]);
    if (!sz) break; // corrupt or truncated: keep what we have
    const idv = id[0], size = sz[0], body = off + id[1] + sz[1];

    if (MKV_ENTER.has(idv)) {
      if (idv === MKV.ENTRY) { cur = { number: 0, type: 0, codec: '', name: '', lang: '', forced: false, def: true, comp: null, strip: null, cues: [] }; tracks.push(cur); }
      else if (idv === MKV.GROUP) lastCue = null;
      else if (idv === MKV.CLUSTER && !trackMap) trackMap = new Map(tracks.map((t) => [t.number, t]));
      off = body;
      continue;
    }
    if (size < 0) { off = body; continue; }

    if (idv === MKV.SIMPLE || idv === MKV.BLOCK) { // a frame; we only keep text-subtitle ones
      const head = await at(body, 16);
      const tn = mkvSize(head, 0);
      lastCue = null;
      const trk = tn && trackMap && trackMap.get(tn[0]);
      if (trk && trk.type === 17 && TEXT_CODECS.has(trk.codec)) {
        const rel = ((head[tn[1]] << 8) | head[tn[1] + 1]) << 16 >> 16; // signed 16-bit
        let payload = (await at(body, size)).subarray(tn[1] + 3);
        if (trk.comp === 0) payload = await inflate(payload);
        else if (trk.comp === 3 && trk.strip) payload = Uint8Array.from([...trk.strip, ...payload]);
        const raw = decoder.decode(payload).replace(/\r/g, '');
        const text = /ASS|SSA/.test(trk.codec) ? assText(raw) : raw.trim();
        if (text) { lastCue = { start: mkvTicksToSec(clusterTime + rel, scale), end: null, text }; trk.cues.push(lastCue); }
      }
    } else if (idv === MKV.DURATION) {
      const d = mkvUint(await at(body, size));
      if (lastCue && lastCue.end === null) lastCue.end = lastCue.start + mkvTicksToSec(d, scale);
    } else if (MKV_LEAF.has(idv) && size <= 4096) {
      const data = await at(body, size);
      const str = () => decoder.decode(data).replace(/\0+$/, '');
      if (idv === MKV.TIMESCALE) scale = mkvUint(data);
      else if (idv === MKV.CTIME) clusterTime = mkvUint(data);
      else if (cur) {
        if (idv === MKV.NUMBER) cur.number = mkvUint(data);
        else if (idv === MKV.TYPE) cur.type = mkvUint(data);
        else if (idv === MKV.CODEC) cur.codec = str();
        else if (idv === MKV.NAME) cur.name = str();
        else if (idv === MKV.LANG) cur.lang = str();
        else if (idv === MKV.FORCED) cur.forced = mkvUint(data) === 1;
        else if (idv === MKV.DEFAULT) cur.def = mkvUint(data) === 1;
        else if (idv === MKV.COMP_ALGO) cur.comp = mkvUint(data);
        else if (idv === MKV.COMP_SETTINGS) cur.strip = data.slice();
      }
    }
    off = body + size;
    if (onProgress && off - lastReport > (4 << 20)) { lastReport = off; onProgress(Math.min(1, off / file.size)); }
  }

  const subtitles = tracks.filter((t) => t.type === 17).map((t) => {
    t.cues.sort((a, b) => a.start - b.start);
    t.cues.forEach((c, i) => {
      if (c.end === null) { const next = t.cues[i + 1]; c.end = Math.min(c.start + 4, next ? next.start : Infinity); }
      if (c.end <= c.start) c.end = c.start + 1;
    });
    return { number: t.number, name: t.name, lang: t.lang, codec: t.codec, forced: t.forced, def: t.def, supported: TEXT_CODECS.has(t.codec), cues: t.cues };
  });
  const audio = tracks.filter((t) => t.type === 2).map((t) => ({ number: t.number, name: t.name, lang: t.lang, codec: t.codec }));
  return { subtitles, audio };
}

// Best guess at "the normal English subtitles": English, not forced/SDH/dub/commentary, most lines.
function pickDefaultSub(subs) {
  const good = subs.filter((t) => t.supported && t.cues.length && /^en/i.test(t.lang) && !/forced|sdh|dub|commentary|signs/i.test(t.name));
  return good.sort((a, b) => b.cues.length - a.cues.length)[0] || null;
}
// ---end pure---

const $ = (id) => document.getElementById(id);
const vid = $('vid');
let cues = [], offset = 0, size = 100;

function applySubs() {
  vid.querySelectorAll('track').forEach((t) => { URL.revokeObjectURL(t.src); t.remove(); });
  if (!cues.length) return;
  const t = document.createElement('track');
  t.kind = 'subtitles'; t.label = 'Subtitles'; t.default = true;
  t.src = URL.createObjectURL(new Blob([buildVtt(cues, offset)], { type: 'text/vtt' }));
  t.addEventListener('load', () => (t.track.mode = 'showing'));
  vid.appendChild(t);
  t.track.mode = 'showing';
}
function applySize() { $('cuestyle').textContent = `video::cue { font-size: ${size}%; }`; }

$('v').onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  cues = []; applySubs(); // the previous episode's subtitles don't belong to this file
  vid.src = URL.createObjectURL(f);
  vid.play().catch(() => {});
  loadEmbedded(f);
};
$('s').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  cues = parseSrt(await f.text());
  $('es').value = '-1'; // the external file replaces any embedded track
  offset = 0; $('o').textContent = '0.0s';
  applySubs();
};
const nudge = (d) => { offset = Math.round((offset + d) * 10) / 10; $('o').textContent = (offset > 0 ? '+' : '') + offset.toFixed(1) + 's'; applySubs(); };
$('m').onclick = () => nudge(-0.5);
$('p').onclick = () => nudge(0.5);
$('r').onclick = () => nudge(-offset);
$('sm').onclick = () => { size = Math.max(50, size - 15); applySize(); };
$('sp').onclick = () => { size += 15; applySize(); };
const toggleBar = () => $('bar').classList.toggle('hidden');
$('h').onclick = toggleBar;
addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'h' && !/INPUT/.test(e.target.tagName)) toggleBar(); });
applySize();

// ---- embedded subtitles + audio tracks (read from the video file itself) ----
let embedded = [], lastScan = null, scanToken = 0;

async function loadEmbedded(file) {
  const mine = ++scanToken; // ignore results that arrive after a newer file was picked
  embedded = []; lastScan = null;
  $('es').innerHTML = '<option value="-1">None / external file</option>';
  $('es').disabled = true;
  $('scan').textContent = 'Scanning subtitles… 0%';
  let res = null;
  try { res = await scanMkv(file, (p) => { if (mine === scanToken) $('scan').textContent = `Scanning subtitles… ${Math.round(p * 100)}%`; }); } catch { res = null; }
  if (mine !== scanToken) return;
  lastScan = res;
  if (!res) { $('scan').textContent = ''; return; } // not an MKV/WebM: nothing to read
  embedded = res.subtitles;
  embedded.forEach((t, i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = `${t.name || t.lang || 'Track ' + t.number}${t.lang && t.name ? ` (${t.lang})` : ''} · ${t.supported ? t.cues.length + ' lines' : 'image-based, not supported'}`;
    o.disabled = !t.supported;
    $('es').appendChild(o);
  });
  $('es').disabled = false;
  $('scan').textContent = embedded.length ? `${embedded.length} subtitle track(s) found` : 'No embedded subtitles';
  const pick = pickDefaultSub(embedded);
  if (pick) { $('es').value = embedded.indexOf(pick); useEmbedded(); }
  setupAudio();
}
function useEmbedded() { const i = +$('es').value; cues = i >= 0 ? embedded[i].cues : []; applySubs(); }
$('es').onchange = useEmbedded;

// Chrome only exposes audio-track switching when its experimental web platform features are on.
function setupAudio() {
  const tracks = vid.audioTracks;
  $('aw').classList.add('hidden');
  $('ahint').textContent = '';
  if (tracks && tracks.length > 1) {
    $('as').innerHTML = '';
    for (let i = 0; i < tracks.length; i++) {
      const o = document.createElement('option');
      o.value = i;
      o.textContent = tracks[i].label || tracks[i].language || `Track ${i + 1}`;
      $('as').appendChild(o);
      if (tracks[i].enabled) $('as').value = i;
    }
    $('aw').classList.remove('hidden');
  } else if (lastScan && lastScan.audio.length > 1) {
    $('ahint').textContent = `${lastScan.audio.length} audio tracks (${lastScan.audio.map((a) => a.name || a.lang || '?').join(', ')}). Chrome plays only the first unless its experimental web platform features flag is on.`;
  }
}
$('as').onchange = () => { const t = vid.audioTracks, sel = +$('as').value; for (let i = 0; i < t.length; i++) t[i].enabled = i === sel; };
vid.addEventListener('loadedmetadata', setupAudio);

// Link to the host page (same site only): heartbeat so it knows we're here, and obey its pause/play requests.
try {
  const channel = new BroadcastChannel('screen-share');
  channel.onmessage = (e) => {
    if (!e.data) return;
    if (e.data.type === 'toggle') {
      if (vid.paused) vid.play().catch(() => {}); else vid.pause();
    } else if (e.data.type === 'seek' && Number.isFinite(e.data.delta)) {
      vid.currentTime = Math.max(0, Math.min(vid.duration || Infinity, vid.currentTime + e.data.delta));
    }
  };
  const alive = () => channel.postMessage({ type: 'alive' });
  alive();
  setInterval(alive, 2000);
} catch {}
</script>
</body>
</html>
