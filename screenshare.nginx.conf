# /etc/nginx/sites-available/screenshare  (replace share.example.com)
server {
    listen 80;
    listen [::]:80;
    server_name screen-share.iamarijit.dev www.screen-share.iamarijit.dev;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;   # keep the signaling WebSocket alive for the whole session
        proxy_send_timeout 86400s;
    }
}
